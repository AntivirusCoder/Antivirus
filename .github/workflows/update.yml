name: Hourly Public Feed Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sigs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and process signatures
        run: |
          python -c "
          import urllib.request
          import json
          import re
          import os

          # Matches both MD5 (32 hex) and SHA-256 (64 hex)
          hash_pattern = re.compile(r'^[a-fA-F0-9]{32}$|^[a-fA-F0-9]{64}$')
          hashes = set()

          # 0. Load existing signatures first so historical hashes are retained
          if os.path.exists('Signatures.txt'):
              try:
                  with open('Signatures.txt', 'r') as f:
                      for line in f:
                          line = line.strip().lower()
                          if hash_pattern.match(line):
                              hashes.add(line)
                  print(f'Loaded {len(hashes)} existing hashes from Signatures.txt')
              except Exception as e:
                  print(f'Warning: Could not read existing Signatures.txt: {e}')

          # Hardcode EICAR test hashes (MD5 & SHA-256)
          hashes.add('44d88612fea8a8f36de82e1278abb02f')
          hashes.add('69630e4574ec6798239b091cda43dca0')
          hashes.add('131f95c51fb29da70814e6a0b841764a8ac563ae71f502c3c3a09a6efd2636a8')

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # 1. Fetch Text-based MD5 and SHA-256 Feeds
          text_urls = [
              'https://bazaar.abuse.ch/export/txt/md5/recent/',
              'https://bazaar.abuse.ch/export/txt/sha256/recent/',
              'https://raw.githubusercontent.com/romainmarcoux/malicious-hash/main/full-hash-md5-aa.txt'
          ]

          for url in text_urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      content = resp.read().decode('utf-8', errors='ignore')
                      for line in content.splitlines():
                          line = line.strip().lower()
                          if hash_pattern.match(line):
                              hashes.add(line)
              except Exception as e:
                  print(f'Warning: Feed unreachable ({url}): {e}')

          # 2. Fetch Abuse.ch ThreatFox Live API Feed (Extracts MD5 & SHA-256)
          try:
              threatfox_url = 'https://threatfox.abuse.ch/export/json/recent/'
              req = urllib.request.Request(threatfox_url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode('utf-8', errors='ignore'))
                  for key, entries in data.items():
                      if isinstance(entries, list):
                          for entry in entries:
                              ioc = entry.get('ioc', '').strip().lower()
                              if hash_pattern.match(ioc):
                                  hashes.add(ioc)
          except Exception as e:
              print(f'Warning: ThreatFox feed unreachable: {e}')

          print(f'Total valid MD5 & SHA-256 hashes stored: {len(hashes)}')

          if len(hashes) > 0:
              with open('Signatures.txt', 'w') as f:
                  for h in sorted(hashes):
                      f.write(h + '\n')
          "

      - name: Commit and push updated signatures
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Hourly multi-feed signature refresh (MD5 + SHA-256)"
          file_pattern: "Signatures.txt"
