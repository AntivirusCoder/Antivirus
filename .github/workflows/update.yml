name: Hourly Public Feed Sync

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically every hour
  workflow_dispatch:      # Allows manual run from GitHub UI

permissions:
  contents: write

jobs:
  update-sigs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and combine MD5 threat feeds
        run: |
          # 1. Create temporary workspace file
          touch temp_sigs.txt

          # 2. Fetch sources (using -L to follow web redirects cleanly)
          curl -sL "https://bazaar.abuse.ch/export/txt/md5/recent/" >> temp_sigs.txt || true
          curl -sL "https://raw.githubusercontent.com/stamparm/maltrail/master/trails/static/malware/md5.txt" >> temp_sigs.txt || true
          curl -sL "https://raw.githubusercontent.com/romainmarcoux/malicious-hash/main/full-hash-md5-aa.txt" >> temp_sigs.txt || true
          curl -sL "https://raw.githubusercontent.com/xme/signature-base/master/iocs/hash-md5.txt" >> temp_sigs.txt || true

          # 3. Always preserve EICAR test signatures
          echo "44d88612fea8a8f36de82e1278abb02f" >> temp_sigs.txt
          echo "69630e4574ec6798239b091cda43dca0" >> temp_sigs.txt

          # 4. Filter 32-char MD5s, lowercase, sort & deduplicate
          tr '[:upper:]' '[:lower:]' < temp_sigs.txt | grep -E '^[a-f0-9]{32}$' | sort -u > Signatures.txt || true

          # 5. Clean up temporary file
          rm -f temp_sigs.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Signatures.txt

          # Safe commit check: only push if Signatures.txt actually changed
          if ! git diff --staged --quiet; then
            git commit -m "Hourly multi-feed signature refresh"
            git push
          else
            echo "No signature updates detected. Skipping commit."
          fi
