name: Hourly Public Feed Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sigs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and process signatures
        run: |
          python -c "
          import urllib.request
          import re

          urls = [
              # Abuse.ch MalwareBazaar (Active recent hashes)
              'https://bazaar.abuse.ch/export/txt/md5/recent/',
              # Romain Marcoux Malicious Hash Collection (Parts AA, AB, AC)
              'https://raw.githubusercontent.com/romainmarcoux/malicious-hash/main/full-hash-md5-aa.txt',
              'https://raw.githubusercontent.com/romainmarcoux/malicious-hash/main/full-hash-md5-ab.txt',
              'https://raw.githubusercontent.com/romainmarcoux/malicious-hash/main/full-hash-md5-ac.txt'
          ]

          md5_pattern = re.compile(r'^[a-fA-F0-9]{32}$')
          hashes = set()

          # Hardcode EICAR test hashes
          hashes.add('44d88612fea8a8f36de82e1278abb02f')
          hashes.add('69630e4574ec6798239b091cda43dca0')

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      content = resp.read().decode('utf-8', errors='ignore')
                      for line in content.splitlines():
                          line = line.strip().lower()
                          if md5_pattern.match(line):
                              hashes.add(line)
              except Exception as e:
                  print(f'Warning: Feed unreachable ({url}): {e}')

          print(f'Total valid hashes collected: {len(hashes)}')

          if len(hashes) > 2:
              with open('Signatures.txt', 'w') as f:
                  for h in sorted(hashes):
                      f.write(h + '\n')
          "

      - name: Commit and push updated signatures
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Hourly multi-feed signature refresh"
          file_pattern: "Signatures.txt"
