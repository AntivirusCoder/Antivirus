name: Auto-Update Malware Signatures

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch:     # Allows you to trigger it manually anytime from GitHub

jobs:
  update-sigs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Fetch latest hashes and update file
        run: |
          # Replace the URL below with any public raw text list of hashes you want to sync from
          curl -s "https://raw.githubusercontent.com/romainmarcoux/malicious-hash/main/full-hash-sha1-aa.txt" > Signatures.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Signatures.txt
          git commit -m "Automated signature database refresh" || echo "No changes to commit"
          git push
          
