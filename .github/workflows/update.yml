name: Hourly Public Feed Sync

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically at the top of every hour
  workflow_dispatch:     # Allows you to trigger it manually anytime from GitHub

jobs:
  update-sigs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch public hash list
        run: |
          # This pulls directly from a public raw text feed with no login or API key required
          curl -s "https://raw.githubusercontent.com/romainmarcoux/malicious-hash/main/full-hash-sha1-aa.txt" > Signatures.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Signatures.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Hourly automated signature refresh" && git push)
